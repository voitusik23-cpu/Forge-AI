# The Platform persistence guarantees are PostgreSQL semantics: row-level security,
# FORCE RLS, partial unique indexes, composite foreign keys, role boundaries. They
# cannot be simulated, so this workflow runs a real server and executes the tests that
# skip everywhere else. A skip is not a pass.
#
# WHY TWO JOBS. The first version ran the entire 2377-test suite inside the job that also
# hosts the PostgreSQL service, and GitHub reported:
#
#   "The hosted runner lost communication with the server. Anything in your workflow
#    that terminates the runner process, starves it for CPU/Memory, or blocks its
#    network access can cause this error."
#
# That run lasted over three hours and the runner died. The Platform tests create a
# database and apply the migrations once per test class -- measured locally at ~10
# minutes for the Platform files alone -- so running them beside the whole suite
# exhausted the runner. The work is split: a focused database job for the Platform
# contract, and a database-free job for the general suite (which also runs the symlink
# tests that skip on Windows). Both carry a hard timeout, so a hang fails visibly
# instead of starving the runner.

name: Forge AI CI

on:
  push:
    branches: [master]
    # A documentation-only change cannot alter the database contract.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.png"
  pull_request:
  workflow_dispatch:

concurrency:
  group: forge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-postgres:
    name: Platform contract on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forge-ci-admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      FORGE_PLATFORM_TEST_DSN: postgresql://postgres:forge-ci-admin@127.0.0.1:5432/postgres
      FORGE_PLATFORM_TEST_APP_LOGIN_PASSWORD: persistence-test-login

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime and platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-platform.txt
          python -c "import asyncpg, sys; print('asyncpg', asyncpg.__version__, '| python', sys.version.split()[0])"

      - name: Confirm the server is reachable before the suite runs
        run: python -B -X utf8 scripts/check_platform_server.py

      - name: Platform tests against the real server
        run: python -B -X utf8 -m unittest discover -s tests -p "test_platform*.py" -v

      - name: Assert the test logins cannot bypass row-level security
        run: python -B -X utf8 scripts/check_platform_roles.py

  general-suite:
    name: Full suite without a database
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Full suite
        # No FORGE_PLATFORM_TEST_DSN here, so the Platform tests skip and are covered by
        # the job above. This job covers everything else, including the symlink tests
        # that skip on Windows.
        run: python -B -X utf8 -m unittest discover -s tests -v
